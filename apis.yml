aid: valthos
name: Valthos
description: >-
  Valthos is a New York City-based biodefense company developing frontier AI
  systems that identify biological threats and design medical countermeasures
  in real time. The company emerged from stealth in October 2025 with $30
  million in backing from the OpenAI Startup Fund, Lux Capital, and Founders
  Fund, with a founding team drawn from Palantir, DeepMind, the Broad
  Institute, and the Arc Institute. Valthos is building AI-powered biodefense
  infrastructure to rapidly analyze biological sequences and update medicines
  at scale for experts in government and the life sciences. The company does
  not yet publish a public API, developer portal, or open-source surface.
